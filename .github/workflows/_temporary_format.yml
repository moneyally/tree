name: temporary-tree-format

on:
  push:
    branches:
      - claude/full-messenger-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/full-messenger-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: |
          cargo fmt --all
      - name: Commit formatted files
        run: |
          git config user.name "tree-format-bot"
          git config user.email "tree-format-bot@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add '*.rs'
          git commit -m "chore: format P0 messenger changes"
          git push origin HEAD:claude/full-messenger-v1
