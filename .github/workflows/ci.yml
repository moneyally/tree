# Build, test and lint on pull requests (and on demand). Mutation testing
# and the ProVerif models run locally (docs/TESTING.md); they take hours.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy (no warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Public text
        run: python3 .claude/skills/tree-deploy/scripts/check_public_text.py
      - name: CLI demo through a server
        run: sh scripts/cli_demo.sh
      - name: Bindings demo (Python)
        run: sh scripts/ffi_demo.sh
