name: Tree CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tree-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt (changed Rust files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check changed Rust files only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          base="$(git merge-base HEAD origin/main)"
          files="$(git diff --name-only "$base...HEAD" -- '*.rs')"
          if [[ -z "$files" ]]; then
            echo "No changed Rust files."
            exit 0
          fi
          failed=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if ! rustfmt --check --edition 2021 "$file"; then
              failed=1
            fi
          done <<< "$files"
          exit "$failed"

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
