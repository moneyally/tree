[workspace]
resolver = "2"
members = ["crates/tree-core", "crates/tree-server", "crates/tree-client", "crates/tree-cli", "crates/tree-ffi"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

# Argon2id is far too slow unoptimised; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Attachments are encrypted in 1 MiB chunks; unoptimised AES-GCM and SHA-256
# would make multi-megabyte test files slow.
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
