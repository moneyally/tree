[workspace]
resolver = "2"
members = ["crates/tree-core", "crates/tree-server", "crates/tree-cli"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

# Argon2id is far too slow unoptimised; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
