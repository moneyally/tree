[package]
name = "tree-bot-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tree bot gateway: the bot's end-to-end encrypted device, run by the bot's developer, with a local HTTP API for the bot's code."

[lib]
name = "tree_bot_gateway"
path = "src/lib.rs"

[[bin]]
name = "tree-bot-gateway"
path = "src/main.rs"

[dependencies]
tree-client = { path = "../tree-client" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
hex = "0.4"

[dev-dependencies]
tree-server = { path = "../tree-server" }
tree-core = { path = "../tree-core" }
tokio = { version = "1", features = ["full"] }
