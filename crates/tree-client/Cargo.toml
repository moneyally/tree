[package]
name = "tree-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tree client logic shared by all apps: server API, sync, two-phase commits, rosters."

[dependencies]
tree-core = { path = "../tree-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1.9"

[dev-dependencies]
tree-server = { path = "../tree-server" }
tokio = { version = "1", features = ["full"] }
