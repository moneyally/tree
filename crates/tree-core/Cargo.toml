[package]
name = "tree-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tree messenger core: end-to-end encrypted groups, identities and the feature registry."

[features]
default = ["pq"]
# Post-quantum hybrid ciphersuites (IETF draft, provisional code points).
pq = [
    "openmls/draft-ietf-mls-pq-ciphersuites",
    "openmls_rust_crypto/draft-ietf-mls-pq-ciphersuites",
    "openmls_libcrux_crypto/draft-ietf-mls-pq-ciphersuites",
    "openmls_basic_credential/draft-ietf-mls-pq-ciphersuites",
    "openmls_sqlite_storage/draft-ietf-mls-pq-ciphersuites",
]

[dependencies]
openmls = "0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_libcrux_crypto = "0.4.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
thiserror = "2"
# Local encrypted storage
openmls_sqlite_storage = "0.3.0"
# Must stay on the same rusqlite as openmls_sqlite_storage. SQLCipher and
# OpenSSL are compiled in, so no system library is needed (phones included).
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Constant-time comparison of envelope tags and hashes.
subtle = "2.6"
# Attachments: AES-256-GCM in the STREAM construction (chunked AEAD).
aes-gcm = "0.10"
aead = { version = "0.5", features = ["stream", "alloc"] }
getrandom = "0.2"
# Recovery phrase: BIP-39 word lists and checksum (English and Korean),
# HKDF (RFC 5869) and Ed25519 for the account recovery key.
bip39 = { version = "3", default-features = false, features = ["std", "korean", "zeroize"] }
hkdf = "0.12"
# Attachment key commitment (HMAC-SHA256 under its own HKDF-derived key).
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["zeroize"] }
# Device linking: HPKE (RFC 9180) Auth mode for the account data a new
# device receives (the same HPKE library OpenMLS uses).
hpke-rs = { version = "0.7", features = ["rustcrypto"] }
base64 = "0.22"

[dev-dependencies]
proptest = "1"
