[package]
name = "tree-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UniFFI bindings of the Tree client for the apps (Kotlin, Swift; Python for tests)."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "tree_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
tree-client = { path = "../tree-client" }
tree-core = { path = "../tree-core" }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
hex = "0.4"
