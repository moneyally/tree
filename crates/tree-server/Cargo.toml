[package]
name = "tree-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tree server: stores and forwards ciphertext (mailboxes, one-time key packages, operator flags)."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
ed25519-dalek = "2"
sha2 = "0.10"
hmac = "0.12"
# Push wake-ups to allowed gateways only (no redirects).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
hex = "0.4"
subtle = "2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
# Only to check the server's header parsing against real messages.
tree-core = { path = "../tree-core" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"] }
